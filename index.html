<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Family Tree</title>
  <style>
    /* CSS: Visual Styling and Layout */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .generation-level {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    .card {
      background: #ffffff;
      border: 2px solid #3498db;
      border-radius: 12px;
      padding: 15px 20px;
      min-width: 140px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }

    .card h3 {
      margin: 0 0 5px 0;
      color: #2c3e50;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }

    .close-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Our Family Tree</h1>

  <!-- HTML Structure -->
  <div class="tree-container" id="treeApp">
    <!-- Generation 1: Grandparents -->
    <div class="generation-level" id="gen1"></div>
    <!-- Generation 2: Parents -->
    <div class="generation-level" id="gen2"></div>
  </div>

  <!-- Detail Popup Modal -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <h2 id="modalName">Name</h2>
      <p id="modalRelation">Relationship</p>
      <p id="modalBio">Bio details go here...</p>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // JavaScript: Data and Interactive Logic
    const familyData = [
      { id: 1, name: "Arthur Smith", role: "Grandfather", gen: 1, bio: "Born in 1945. Loved gardening and woodworking." },
      { id: 2, name: "Eleanor Smith", role: "Grandmother", gen: 1, bio: "Born in 1948. Master baker and teacher." },
      { id: 3, name: "David Smith", role: "Father", gen: 2, bio: "Born in 1975. Software engineer and football fan." },
      { id: 4, name: "Sarah Smith", role: "Aunt", gen: 2, bio: "Born in 1978. Wildlife photographer." }
    ];

    function renderTree() {
      const gen1Container = document.getElementById('gen1');
      const gen2Container = document.getElementById('gen2');

      familyData.forEach(person => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${person.name}</h3><p>${person.role}</p>`;
        card.onclick = () => showDetails(person);

        if (person.gen === 1) {
          gen1Container.appendChild(card);
        } else if (person.gen === 2) {
          gen2Container.appendChild(card);
        }
      });
    }

    function showDetails(person) {
      document.getElementById('modalName').innerText = person.name;
      document.getElementById('modalRelation').innerText = person.role;
      document.getElementById('modalBio').innerText = person.bio;
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    // Run when page loads
    renderTree();
  </script>

</body>
</html>
